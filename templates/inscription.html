{% extends "base.html" %}
{% block titre %}Créer un compte{% endblock %}

{% block contenu %}
<div class="form-page">
    <div class="form-carte">
        <h1>Créer un compte</h1>
        <p class="sous-titre">Quelques secondes suffisent.</p>

        <form method="post">
            <div class="grille-2">
                <div class="champ-form">
                    <label for="prenom">Prénom</label>
                    <input type="text" name="prenom" id="prenom" required>
                </div>
                <div class="champ-form">
                    <label for="nom">Nom</label>
                    <input type="text" name="nom" id="nom" required>
                </div>
            </div>
            <div class="champ-form">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required autocomplete="email">
            </div>
            <div class="champ-form">
                <label for="mot_de_passe">Mot de passe</label>
                <input type="password" name="mot_de_passe" id="mot_de_passe" required minlength="6" autocomplete="new-password">
            </div>
            <button class="btn btn-primaire btn-bloc">Créer mon compte</button>
        </form>

        <p class="form-lien">Déjà inscrit ? <a href="{{ url_for('auth.connexion') }}">Se connecter</a></p>
    </div>
</div>
{% endblock %}
